# =====================================================
# Hypridle Configuration
# =====================================================
# Idle daemon for Hyprland
# Manages screen timeout, locking, and suspend
# =====================================================

general {
    lock_cmd = pidof hyprlock || hyprlock       # Avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # Lock before suspend
    after_sleep_cmd = sleep 1 && hyprctl dispatch dpms on  # Turn on display after resume
    ignore_dbus_inhibit = false                 # Allow inhibit requests from status bar
}

# Screen dimming after 5 minutes
listener {
    timeout = 300                               # 5 minutes
    on-timeout = brightnessctl -s set 10%       # Dim screen to 10%
    on-resume = brightnessctl -r                # Restore previous brightness
}

# Lock screen after 10 minutes
listener {
    timeout = 600                               # 10 minutes
    on-timeout = loginctl lock-session          # Lock session
}

# Turn off display after 15 minutes
listener {
    timeout = 900                               # 15 minutes
    on-timeout = hyprctl dispatch dpms off      # Turn off display
    on-resume = hyprctl dispatch dpms on        # Turn on display
}

# Suspend after 30 minutes
listener {
    timeout = 1800                              # 30 minutes
    on-timeout = systemctl suspend              # Suspend system
}
