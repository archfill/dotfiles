# =====================================================
# Hyprland Configuration
# =====================================================
# Generated for: NVIDIA RTX 4070 + linux-zen
# Dotfiles: https://github.com/yourusername/dotfiles
# =====================================================

# =====================================================
# Environment Variables
# =====================================================

# Load local environment variables (GPU-specific settings)
# This file is auto-generated during installation and not tracked by git
source = ~/.config/hypr/local.conf

# XDG
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Qt
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# Toolkit Backend
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# Input Method (fcitx5)
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx

# Wallpaper transition (awww)
env = AWWW_TRANSITION,grow
env = AWWW_TRANSITION_DURATION,2

# =====================================================
# Monitor Configuration (Environment-specific)
# =====================================================
# Load monitor-specific configuration
# This file is auto-generated during installation and not tracked by git
source = ~/.config/hypr/monitors.conf

# =====================================================
# Autostart
# =====================================================

# Keyring (for VSCode, browsers, and other apps)
exec-once = gnome-keyring-daemon --start --components=secrets

# Input method
exec-once = fcitx5 -d

# Status bar
exec-once = waybar

# Notification daemon
exec-once = swaync

# Network management
exec-once = nm-applet --indicator

# Polkit authentication agent
exec-once = systemctl --user start hyprpolkitagent

# Wallpaper (awww)
exec-once = awww-daemon && awww img /home/archfill/.config/hypr/wallpapers/lava-abstract-formation-8k-oc-3440x1440.jpg

# Idle management
exec-once = hypridle

# Clipboard manager (clipse - TUI clipboard manager)
exec-once = clipse -listen

# Window switcher (Alt+Tab style)
exec-once = hyprswitch init --show-title &

# =====================================================
# Input Configuration
# =====================================================

input {
    kb_layout = us
    repeat_rate = 75
    repeat_delay = 300
    # kb_variant =
    # kb_model =
    # kb_options =
    # kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = false
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# =====================================================
# General Settings
# =====================================================

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(74c7ecff) rgba(f5c2e7ff) 45deg  # Catppuccin Mocha: Sapphire to Pink
    col.inactive_border = rgba(585b70aa)                     # Catppuccin Mocha: Surface2

    layout = dwindle

    allow_tearing = false
}

# =====================================================
# Decoration
# =====================================================

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

# =====================================================
# Animations
# =====================================================

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# =====================================================
# Layout: Dwindle
# =====================================================

dwindle {
    pseudotile = true
    preserve_split = true
}

# =====================================================
# Layout: Master
# =====================================================

master {
    new_status = master
}

# =====================================================
# Group (Tabbed Windows)
# =====================================================

group {
    col.border_active = rgba(74c7ecff)
    col.border_inactive = rgba(585b70aa)

    groupbar {
        enabled = true
        font_size = 10
        height = 20
        col.active = rgba(74c7ecff)
        col.inactive = rgba(313244ff)
    }
}

# =====================================================
# Gestures
# =====================================================

gestures {
    # workspace_swipe is enabled by default in v0.51+
    # workspace_swipe = true
}

# =====================================================
# Miscellaneous
# =====================================================

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# =====================================================
# Window Rules
# =====================================================

# Example: Make Firefox picture-in-picture float
windowrule = float 1, match:class firefox, match:title Picture-in-Picture

# Clipse clipboard manager
windowrule = float 1, match:class clipse
windowrule = size 622 652, match:class clipse
windowrule = center 1, match:class clipse

# Example: Opacity for terminals
# windowrule = opacity 0.9, match:class kitty

# =====================================================
# Keybindings (loaded from modules)
# =====================================================
source = ~/.config/hypr/modules/keybinds.conf

# =====================================================
# End of Configuration
# =====================================================
