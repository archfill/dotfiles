# =====================================================
# Hyprland Configuration
# =====================================================
# Generated for: NVIDIA RTX 4070 + linux-zen
# Dotfiles: https://github.com/yourusername/dotfiles
# =====================================================

# =====================================================
# Environment Variables
# =====================================================

# Load local environment variables (GPU-specific settings)
# This file is auto-generated during installation and not tracked by git
source = ~/.config/hypr/local.conf

# XDG
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Qt
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# Toolkit Backend
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# Input Method (fcitx5)
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx

# =====================================================
# Monitor Configuration
# =====================================================

# Main display: Huawei Ultrawide (3440x1440@165Hz)
monitor=DP-3,3440x1440@165,1080x0,1

# Sub display: BenQ (portrait mode, 1080x1920@60Hz)
# transform: 1 = 90° clockwise, 3 = 90° counter-clockwise
monitor=HDMI-A-1,1920x1080@60,0x0,1,transform,3

# =====================================================
# Workspace Assignment
# =====================================================

# Assign workspaces to monitors
workspace=1,monitor:DP-3
workspace=2,monitor:DP-3
workspace=3,monitor:DP-3
workspace=4,monitor:DP-3
workspace=5,monitor:DP-3

workspace=6,monitor:HDMI-A-1
workspace=7,monitor:HDMI-A-1
workspace=8,monitor:HDMI-A-1
workspace=9,monitor:HDMI-A-1
workspace=10,monitor:HDMI-A-1

# =====================================================
# Autostart
# =====================================================

# Keyring (for VSCode, browsers, and other apps)
exec-once = gnome-keyring-daemon --start --components=secrets

# Input method
exec-once = fcitx5 -d

# Status bar
exec-once = waybar

# Notification daemon
exec-once = swaync

# Network management
exec-once = nm-applet --indicator

# Polkit authentication agent
exec-once = /usr/lib/hyprpolkitagent

# Wallpaper
exec-once = hyprpaper

# Idle management
exec-once = hypridle

# Clipboard manager (optional)
# exec-once = wl-paste --watch cliphist store

# =====================================================
# Input Configuration
# =====================================================

input {
    kb_layout = us
    # kb_variant =
    # kb_model =
    # kb_options =
    # kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = false
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# =====================================================
# General Settings
# =====================================================

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle

    allow_tearing = false
}

# =====================================================
# Decoration
# =====================================================

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

# =====================================================
# Animations
# =====================================================

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# =====================================================
# Layout: Dwindle
# =====================================================

dwindle {
    pseudotile = true
    preserve_split = true
}

# =====================================================
# Layout: Master
# =====================================================

master {
    new_status = master
}

# =====================================================
# Gestures
# =====================================================

gestures {
    # workspace_swipe is enabled by default in v0.51+
    # workspace_swipe = true
}

# =====================================================
# Miscellaneous
# =====================================================

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# =====================================================
# Window Rules
# =====================================================

# Example: Make Firefox picture-in-picture float
windowrulev2 = float,class:^(firefox)$,title:^(Picture-in-Picture)$

# Example: Opacity for terminals
# windowrulev2 = opacity 0.9 0.9,class:^(kitty)$

# =====================================================
# Keybindings
# =====================================================

# Mod key (Super/Windows key)
$mainMod = SUPER

# Applications
bind = $mainMod, RETURN, exec, ghostty
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, nautilus
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, fuzzel
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, F, fullscreen,

# Screenshot
bind = , PRINT, exec, hyprshot -m region -o ~/Pictures/Screenshots
bind = SHIFT, PRINT, exec, hyprshot -m window -o ~/Pictures/Screenshots
bind = $mainMod, PRINT, exec, hyprshot -m output -o ~/Pictures/Screenshots

# Screenshot with annotation
bind = CTRL, PRINT, exec, hyprshot -m region -o ~/Pictures/Screenshots --raw | satty --filename -

# Notifications
bind = $mainMod, N, exec, swaync-client -t -sw

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move focus with mainMod + hjkl (vim-like)
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Move windows with mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Move windows with mainMod + SHIFT + hjkl (vim-like)
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Move window to another monitor
bind = $mainMod CTRL, left, movewindow, mon:l
bind = $mainMod CTRL, right, movewindow, mon:r
bind = $mainMod CTRL, up, movewindow, mon:u
bind = $mainMod CTRL, down, movewindow, mon:d

# Move window to another monitor (vim-like)
bind = $mainMod CTRL, h, movewindow, mon:l
bind = $mainMod CTRL, l, movewindow, mon:r
bind = $mainMod CTRL, k, movewindow, mon:u
bind = $mainMod CTRL, j, movewindow, mon:d

# Media keys
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Media player controls
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Brightness controls
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# =====================================================
# End of Configuration
# =====================================================
