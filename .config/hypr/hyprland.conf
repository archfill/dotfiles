# =====================================================
# Hyprland Configuration
# =====================================================
# Generated for: NVIDIA RTX 4070 + linux-zen
# Dotfiles: https://github.com/yourusername/dotfiles
# =====================================================

# =====================================================
# Environment Variables
# =====================================================

# Load matugen colors synced from the current Caelestia scheme
source = ~/.config/hypr/colors.conf

# XDG
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Qt
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_STYLE_OVERRIDE,adwaita-dark

# Theme
env = GTK_THEME,Adwaita:dark
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = COLORTERM,truecolor

# Toolkit Backend
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# NVIDIA / VA-API
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

# Input Method (fcitx5)
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx

# Cursor
cursor {
    no_hardware_cursors = false
}

# =====================================================
# Monitor Configuration (Environment-specific)
# =====================================================
# Load monitor-specific configuration
# This file is auto-generated during installation and not tracked by git
source = ~/.config/hypr/monitors.conf

# =====================================================
# Autostart
# =====================================================

# Export environment variables to systemd user session
# Required for systemd user services to access Hyprland, PATH, XDG vars, etc.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_DATA_DIRS HYPRLAND_INSTANCE_SIGNATURE PATH GTK_IM_MODULE QT_IM_MODULE XMODIFIERS INPUT_METHOD SDL_IM_MODULE

# Keyring (for VSCode, browsers, and other apps)
exec-once = gnome-keyring-daemon --start --components=secrets

# Password manager
exec-once = 1password

# Input method
exec-once = fcitx5 -d

# Status bar / desktop shell
exec-once = systemctl --user start caelestia.service

# Notification daemon
# Caelestia Shell owns notifications via Quickshell's NotificationServer.

# Polkit authentication agent
exec-once = systemctl --user start hyprpolkitagent

# Idle management (use local override if exists, otherwise default)
exec-once = bash -c 'if [ -f ~/.config/hypr/hypridle.local.conf ]; then hypridle -c ~/.config/hypr/hypridle.local.conf; else hypridle; fi'

# Clipboard manager (cliphist - rofi integration)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# =====================================================
# Input Configuration
# =====================================================

input {
    kb_layout = us
    repeat_rate = 75
    repeat_delay = 300
    # kb_variant =
    # kb_model =
    # kb_options =
    # kb_rules =

    follow_mouse = 0

    touchpad {
        natural_scroll = false
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# =====================================================
# General Settings
# =====================================================

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba($primary) rgba($tertiary) 45deg  # Material You (matugen)
    col.inactive_border = rgba($surface_variant)              # Material You (matugen)

    layout = dwindle

    allow_tearing = false
}

# =====================================================
# XWayland
# =====================================================

xwayland {
    force_zero_scaling = true
}

# =====================================================
# Decoration
# =====================================================

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

# =====================================================
# Animations
# =====================================================

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# =====================================================
# Layout: Dwindle
# =====================================================

dwindle {
    preserve_split = true
}

# =====================================================
# Layout: Master
# =====================================================

master {
    new_status = master
}

# =====================================================
# Group (Tabbed Windows)
# =====================================================

group {
    col.border_active = rgba($primary)
    col.border_inactive = rgba($surface_variant)

    groupbar {
        enabled = true
        font_family = JetBrainsMono Nerd Font Propo
        font_size = 11
        height = 22
        gradients = true
        render_titles = true
        text_color = rgba($on_surface)
        col.active = rgba($primary)
        col.inactive = rgba($surface)
    }
}

# =====================================================
# Gestures
# =====================================================

gestures {
    # workspace_swipe is enabled by default in v0.51+
    # workspace_swipe = true
}

# =====================================================
# Miscellaneous
# =====================================================

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# =====================================================
# Window Rules
# =====================================================

# Example: Make Firefox picture-in-picture float
windowrule = float 1, match:class firefox, match:title Picture-in-Picture

# Nextcloud - float all popups
windowrule = float 1, match:class com.nextcloud.desktopclient.nextcloud
windowrule = float 1, match:class Nextcloud
windowrule = center 1, match:class com.nextcloud.desktopclient.nextcloud

# 1Password
windowrule = match:initial_class .*(1[Pp]assword|[Oo]ne[Pp]assword).*, float on
windowrule = match:initial_class .*(1[Pp]assword|[Oo]ne[Pp]assword).*, center on
windowrule = match:initial_title .*(1[Pp]assword|[Oo]ne[Pp]assword).*, float on
windowrule = match:initial_title .*(1[Pp]assword|[Oo]ne[Pp]assword).*, center on

# Example: Opacity for terminals
# windowrule = opacity 0.9, match:class kitty
windowrule = match:class looking-glass-client, opacity 1.0 1.0
windowrule = match:class looking-glass-client, force_rgbx on
windowrule = match:class looking-glass-client, float 1
windowrule = match:class looking-glass-client, size 2560 1440
windowrule = match:class looking-glass-client, center 1
windowrule = match:class looking-glass-client, workspace 5
windowrule = match:class looking-glass-client, fullscreen 1
windowrule = match:class gamescope, monitor DP-3

# =====================================================
# Keybindings (loaded from modules)
# =====================================================
source = ~/.config/hypr/modules/keybinds.conf

# =====================================================
# End of Configuration
# =====================================================
