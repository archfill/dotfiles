# =====================================================
# Hyprlock Configuration
# =====================================================
# GPU-accelerated screen locking utility for Hyprland
# =====================================================

general {
    disable_loading_bar = false
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

# Background
background {
    monitor =
    path = screenshot   # Use screenshot as background (blur effect)
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Input field
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgb(89b4fa)
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)
    fade_on_empty = true
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <i>Input Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = -1 # -1 means complete rounding (circle/oval)
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8) # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    fail_timeout = 2000 # milliseconds before fail_text and fail_color disappears
    fail_transition = 300 # transition time in ms between normal outer_color and fail_color
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below

    position = 0, -20
    halign = center
    valign = center
}

# Date (Time)
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H:%M:%S") </big></b>"
    color = rgb(cdd6f4)
    font_size = 64
    font_family = JetBrainsMono Nerd Font Propo

    position = 0, 80
    halign = center
    valign = center
}

# Day-Date
label {
    monitor =
    text = cmd[update:1000] echo "<b> $(date +"%A, %d %B %Y") </b>"
    color = rgb(cdd6f4)
    font_size = 24
    font_family = JetBrainsMono Nerd Font Propo

    position = 0, -40
    halign = center
    valign = top
}

# User
label {
    monitor =
    text =     $USER
    color = rgb(cdd6f4)
    font_size = 20
    font_family = JetBrainsMono Nerd Font Propo

    position = 0, 100
    halign = center
    valign = bottom
}
