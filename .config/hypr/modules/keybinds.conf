# =====================================================
# Keybindings Configuration
# =====================================================
# Organized by category for 40% keyboard optimization
# =====================================================

# Mod keys
$mainMod = SUPER
$hyper = CTRL SHIFT ALT SUPER

# =====================================================
# A. App Launcher
# =====================================================

bind = $hyper, RETURN, exec, ghostty
bind = $hyper, E, exec, dolphin
bind = $hyper, D, exec, pkill rofi || rofi -show combi -modi "window,drun,run,calc,emoji,󰐥:~/.config/hypr/scripts/rofi-power.sh" -combi-modi "window,drun,󰐥" -display-combi "󰍜"
bind = $hyper, V, exec, pkill rofi || cliphist list | rofi -dmenu -p "󰅍" | cliphist decode | wl-copy
bind = $hyper, N, exec, swaync-client -t -sw
bind = $hyper, slash, exec, pkill rofi || ~/.config/hypr/scripts/keybind-cheatsheet.sh
bind = $mainMod, W, exec, pkill rofi || ~/.config/hypr/scripts/wallpaper-picker.sh
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper-picker.sh --random

# =====================================================
# B. Window Basic
# =====================================================

bind = $hyper, Q, killactive,
bind = $hyper, SPACE, togglefloating,
bind = $hyper, F, fullscreen,
bind = $mainMod, T, pseudo,

# =====================================================
# C. Window Layout (Focus / Move / Resize)
# =====================================================

# Focus movement (vim-like)
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Window movement
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Window resize
bind = $mainMod SHIFT, left, resizeactive, -50 0
bind = $mainMod SHIFT, right, resizeactive, 50 0
bind = $mainMod SHIFT, up, resizeactive, 0 -50
bind = $mainMod SHIFT, down, resizeactive, 0 50

# Move window to another monitor
bind = $mainMod CTRL, h, movewindow, mon:l
bind = $mainMod CTRL, l, movewindow, mon:r
bind = $mainMod CTRL, k, movewindow, mon:u
bind = $mainMod CTRL, j, movewindow, mon:d

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# =====================================================
# D. Workspace (Submap for 40% keyboard)
# =====================================================

# Workspace navigation
bind = $hyper, comma, workspace, -1
bind = $hyper, period, workspace, +1

# Enter workspace submap
bind = $hyper, S, exec, ~/.config/hypr/scripts/submap-overlay.sh open
bind = $hyper, S, submap, workspace
submap = workspace
  # Switch workspace with A/S/D/F/G (1-5) - home row
  bind = , A, workspace, 1
  bind = , A, exec, ~/.config/hypr/scripts/submap-overlay.sh close
  bind = , A, submap, reset
  bind = , S, workspace, 2
  bind = , S, exec, ~/.config/hypr/scripts/submap-overlay.sh close
  bind = , S, submap, reset
  bind = , D, workspace, 3
  bind = , D, exec, ~/.config/hypr/scripts/submap-overlay.sh close
  bind = , D, submap, reset
  bind = , F, workspace, 4
  bind = , F, exec, ~/.config/hypr/scripts/submap-overlay.sh close
  bind = , F, submap, reset
  bind = , G, workspace, 5
  bind = , G, exec, ~/.config/hypr/scripts/submap-overlay.sh close
  bind = , G, submap, reset
  # Move to previous/next workspace with H/L (continuous - no close)
  bind = , H, workspace, e-1
  bind = , L, workspace, e+1
  # Move window to workspace with Shift + A/S/D/F/G
  bind = SHIFT, A, movetoworkspace, 1
  bind = SHIFT, A, exec, ~/.config/hypr/scripts/submap-overlay.sh close
  bind = SHIFT, A, submap, reset
  bind = SHIFT, S, movetoworkspace, 2
  bind = SHIFT, S, exec, ~/.config/hypr/scripts/submap-overlay.sh close
  bind = SHIFT, S, submap, reset
  bind = SHIFT, D, movetoworkspace, 3
  bind = SHIFT, D, exec, ~/.config/hypr/scripts/submap-overlay.sh close
  bind = SHIFT, D, submap, reset
  bind = SHIFT, F, movetoworkspace, 4
  bind = SHIFT, F, exec, ~/.config/hypr/scripts/submap-overlay.sh close
  bind = SHIFT, F, submap, reset
  bind = SHIFT, G, movetoworkspace, 5
  bind = SHIFT, G, exec, ~/.config/hypr/scripts/submap-overlay.sh close
  bind = SHIFT, G, submap, reset
  # Exit submap and close overlay
  bind = , ESCAPE, exec, ~/.config/hypr/scripts/submap-overlay.sh close
  bind = , ESCAPE, submap, reset
  bind = , RETURN, exec, ~/.config/hypr/scripts/submap-overlay.sh close
  bind = , RETURN, submap, reset
  bind = $mainMod, S, exec, ~/.config/hypr/scripts/submap-overlay.sh close
  bind = $mainMod, S, submap, reset
submap = reset

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# =====================================================
# E. Group (Tabbed Windows)
# =====================================================

bind = $mainMod, G, togglegroup,
bind = $mainMod, TAB, changegroupactive, f
bind = $mainMod SHIFT, TAB, changegroupactive, b
bind = $mainMod, period, changegroupactive, f
bind = $mainMod, comma, changegroupactive, b
bind = $mainMod SHIFT, G, moveoutofgroup,
bind = $mainMod ALT, h, moveintogroup, l
bind = $mainMod ALT, l, moveintogroup, r
bind = $mainMod ALT, k, moveintogroup, u
bind = $mainMod ALT, j, moveintogroup, d

# =====================================================
# F. Screenshot
# =====================================================

# PRINT key (for full keyboard)
bind = , PRINT, exec, hyprshot -m region -o ~/Pictures/Screenshots
bind = SHIFT, PRINT, exec, hyprshot -m window -o ~/Pictures/Screenshots
bind = $mainMod, PRINT, exec, hyprshot -m output -o ~/Pictures/Screenshots
bind = CTRL, PRINT, exec, hyprshot -m region -o ~/Pictures/Screenshots --raw | satty --filename -

# Super+P (for 40% keyboard without PRINT key)
bind = $mainMod, P, exec, hyprshot -m region -o ~/Pictures/Screenshots
bind = $mainMod SHIFT, P, exec, hyprshot -m window -o ~/Pictures/Screenshots
bind = $mainMod CTRL, P, exec, hyprshot -m output -o ~/Pictures/Screenshots
bind = $mainMod ALT, P, exec, hyprshot -m region -o ~/Pictures/Screenshots --raw | satty --filename -

# =====================================================
# G. System
# =====================================================

bind = $mainMod, R, exec, ~/.config/hypr/scripts/waybar-launch.sh
bind = $hyper, L, exec, hyprlock
bind = $hyper, M, exit,
bind = $hyper, C, exec, hyprswitch gui --mod-key super_l --key c --reverse-key=mod=shift

# Media keys
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Media player controls
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Brightness controls
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
