# =====================================================
# Hyprpaper Configuration
# =====================================================
# Wallpaper manager for Hyprland
# =====================================================

# Preload wallpapers (adjust paths as needed)
# preload = ~/Pictures/Wallpapers/wallpaper.jpg

# Set wallpaper for specific monitor
# wallpaper = monitor_name,~/Pictures/Wallpapers/wallpaper.jpg

# Set wallpaper for all monitors
# wallpaper = ,~/Pictures/Wallpapers/wallpaper.jpg

# Example with solid color (if no wallpaper image)
# Uncomment to use a solid color instead:
# preload = /dev/null
# wallpaper = ,#1e1e2e

# Splash screen
splash = false

# IPC
ipc = on
