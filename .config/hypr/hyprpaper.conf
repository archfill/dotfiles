# =====================================================
# Hyprpaper Configuration
# =====================================================
# Wallpaper manager for Hyprland
# =====================================================

# Preload wallpapers
preload = ~/.config/hypr/wallpapers/lava-abstract-formation-8k-oc-3440x1440.jpg

# Alternative wallpapers (uncomment to use):
# preload = ~/.config/hypr/wallpapers/abstract-design-3440x1440.jpg
# preload = ~/.config/hypr/wallpapers/dark-apple-mac-pro-4k-04-3440x1440.jpg
# preload = ~/.config/hypr/wallpapers/sketches-gradients-icons-logo-4k-a8-3440x1440.jpg

# Set wallpaper for main monitor (Huawei Ultrawide 3440x1440)
wallpaper = DP-3,~/.config/hypr/wallpapers/lava-abstract-formation-8k-oc-3440x1440.jpg

# Set wallpaper for sub monitor (BenQ portrait)
wallpaper = HDMI-A-1,~/.config/hypr/wallpapers/lava-abstract-formation-8k-oc-3440x1440.jpg

# Alternative: Set same wallpaper for all monitors
# wallpaper = ,~/.config/hypr/wallpapers/lava-abstract-formation-8k-oc-3440x1440.jpg

# Splash screen
splash = false

# IPC
ipc = on
