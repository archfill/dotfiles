# ============================================================================
# Alacritty Common Configuration
# ============================================================================
# Cross-platform settings shared across Linux, macOS, and Windows
# Colorscheme: Iceberg Dark
# ============================================================================

# ============================================================================
# General Settings
# ============================================================================
[general]
live_config_reload = true

# ============================================================================
# Environment Variables
# ============================================================================
[env]
TERM = "xterm-256color"

# ============================================================================
# Window Configuration
# ============================================================================
[window]
# Window dimensions (0 = use default)
dimensions = { columns = 0, lines = 0 }

# Padding around terminal content
padding = { x = 2, y = 2 }
dynamic_padding = false

# Window decorations
decorations = "full"
dynamic_title = true

# Background opacity (0.0 - 1.0)
opacity = 0.9

# Startup mode: "Windowed", "Maximized", "Fullscreen"
startup_mode = "Maximized"

# ============================================================================
# Scrolling
# ============================================================================
[scrolling]
history = 10000
multiplier = 3

# ============================================================================
# Font Configuration
# ============================================================================
# Note: Font size is configured per-platform in os-specific files
# (linux.toml, macos.toml, windows.toml)

[font.normal]
family = "HackGen Console NF"

[font.bold]
family = "HackGen Console NF"

[font.italic]
family = "HackGen Console NF"

[font.offset]
x = 0
y = 0

[font.glyph_offset]
x = 0
y = 0

# ============================================================================
# Colors (Catppuccin Mocha)
# ============================================================================
# Catppuccin is a community-driven pastel theme
# https://github.com/catppuccin/catppuccin
[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.normal]
black   = "#45475a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#bac2de"

[colors.bright]
black   = "#585b70"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#a6adc8"

# ============================================================================
# Bell
# ============================================================================
[bell]
animation = "EaseOutExpo"
duration = 0
color = "#ffffff"

# ============================================================================
# Cursor
# ============================================================================
[cursor]
style = "Block"
unfocused_hollow = true

# ============================================================================
# Mouse
# ============================================================================
[mouse]
hide_when_typing = false

[[mouse.bindings]]
mouse = "Middle"
action = "PasteSelection"

# ============================================================================
# Selection
# ============================================================================
[selection]
save_to_clipboard = false
semantic_escape_chars = ''',│`|:"' ()[]{}<>'''

# ============================================================================
# Terminal Shell
# ============================================================================
[terminal.shell]
program = "/bin/zsh"
args = ["--login"]

# ============================================================================
# Debug Settings
# ============================================================================
[debug]
render_timer = false
persistent_logging = false

# ============================================================================
