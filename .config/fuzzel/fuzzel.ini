# =====================================================
# Fuzzel Configuration
# =====================================================
# Fast application launcher for Wayland
# Catppuccin Mocha Theme
# =====================================================

[main]
terminal = ghostty -e
layer = overlay
width = 40
horizontal-pad = 20
vertical-pad = 10
inner-pad = 10

# Font configuration (unified with Waybar)
font = HackGen35 Console NF:size=12
dpi-aware = yes

# Icons
icons-enabled = yes
icon-theme = Papirus-Dark
line-height = 25
letter-spacing = 0

[colors]
background = 1e1e2eee
text = cdd6f4ff
match = 89b4faff
selection = 89b4fa33
selection-text = cdd6f4ff
selection-match = 89b4faff
border = 89b4faff

[border]
width = 2
radius = 10

[dmenu]
exit-immediately-if-empty = yes
