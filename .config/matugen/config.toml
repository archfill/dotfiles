# Matugen Configuration
# Material You color generation synced from the current Caelestia scheme

[config]
# Dark mode by default
mode = "dark"

# Scheme type (tonal-spot is balanced)
type = "scheme-tonal-spot"

# Cache for faster regeneration
caching = true

# Hyprland colors template
[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland-colors.lua"
output_path = "~/.config/hypr/colors_generated.lua"
post_hook = "hyprctl reload"

# Rofi colors template
[templates.rofi]
input_path = "~/.config/matugen/templates/rofi-colors.rasi"
output_path = "~/.config/rofi/colors.rasi"

# Kitty colors template
[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/colors-matugen.conf"

# Alacritty colors template
[templates.alacritty]
input_path = "~/.config/matugen/templates/alacritty-colors.toml"
output_path = "~/.config/alacritty/colors-matugen.toml"
