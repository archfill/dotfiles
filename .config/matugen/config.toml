# Matugen Configuration
# Material You color generation from wallpaper

[config]
# Dark mode by default
mode = "dark"

# Scheme type (tonal-spot is balanced)
type = "scheme-tonal-spot"

# Cache for faster regeneration
caching = true

# Hyprland colors template
[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland-colors.conf"
output_path = "~/.config/hypr/colors.conf"
post_hook = "hyprctl reload"

# Rofi colors template
[templates.rofi]
input_path = "~/.config/matugen/templates/rofi-colors.rasi"
output_path = "~/.config/rofi/colors.rasi"

# Waybar colors template
[templates.waybar]
input_path = "~/.config/matugen/templates/waybar-colors.css"
output_path = "~/.config/waybar/colors/matugen.css"

# SwayNC colors template
[templates.swaync]
input_path = "~/.config/matugen/templates/swaync-colors.css"
output_path = "~/.config/swaync/colors/matugen.css"

# Kitty colors template
[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/colors-matugen.conf"

# Alacritty colors template
[templates.alacritty]
input_path = "~/.config/matugen/templates/alacritty-colors.toml"
output_path = "~/.config/alacritty/colors-matugen.toml"
