# =============================================
# Linux固有設定
# =============================================

# クリップボード連携の優先順位:
# 1. wl-clipboard (Wayland)
# 2. xsel (X11 - 推奨)
# 3. xclip (X11 - フォールバック)

# =============================================
# Waylandクリップボード連携 (wl-clipboard)
# =============================================
# Waylandセッションを検出してwl-clipboardを優先使用
if-shell '[ "$XDG_SESSION_TYPE" = "wayland" ] && type wl-copy' \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'"

if-shell '[ "$XDG_SESSION_TYPE" = "wayland" ] && type wl-copy' \
  "bind-key -T copy-mode-vi Y send-keys -X copy-pipe 'wl-copy'"

if-shell '[ "$XDG_SESSION_TYPE" = "wayland" ] && type wl-copy' \
  "bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'wl-copy'"

if-shell '[ "$XDG_SESSION_TYPE" = "wayland" ] && type wl-paste' \
  "bind ] run-shell 'wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer'"

# =============================================
# X11クリップボード連携 (xsel - 推奨)
# =============================================
# Waylandでない場合、または wl-clipboard が利用できない場合に使用
if-shell '[ "$XDG_SESSION_TYPE" != "wayland" ] && type xsel' \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xsel -ib'"

if-shell '[ "$XDG_SESSION_TYPE" != "wayland" ] && type xsel' \
  "bind-key -T copy-mode-vi Y send-keys -X copy-pipe 'xsel -ib'"

if-shell '[ "$XDG_SESSION_TYPE" != "wayland" ] && type xsel' \
  "bind ] run-shell 'xsel -ob | tmux load-buffer - && tmux paste-buffer'"

# =============================================
# X11クリップボード連携 (xclip - フォールバック)
# =============================================
if-shell '[ "$XDG_SESSION_TYPE" != "wayland" ] && ! type xsel && type xclip' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -i -sel clip > /dev/null"'

if-shell '[ "$XDG_SESSION_TYPE" != "wayland" ] && ! type xclip && type xsel' \
  'bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -i -sel clip > /dev/null"'