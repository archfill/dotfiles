# Catppuccin Mocha Starship Configuration
# Official Catppuccin Mocha color palette with Powerline-style segments

"$schema" = 'https://starship.rs/config-schema.json'

# Catppuccin Mocha Palette
palette = "catppuccin_mocha"

format = """
$os\
[](bg:blue fg:surface0)\
$directory\
[](fg:blue bg:mauve)\
$git_branch\
$git_status\
[](fg:mauve bg:surface1)\
$python\
$nodejs\
$rust\
$golang\
$java\
$lua\
$c\
$cmake\
[](fg:surface1 bg:surface0)\
$docker_context\
$kubernetes\
[](fg:surface0 bg:peach)\
$aws\
$gcloud\
$azure\
[](fg:peach)\
$fill\
[](fg:yellow)\
$cmd_duration\
$line_break\
$character"""

# Catppuccin Mocha Color Definitions
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

# Fill for spacing
[fill]
symbol = " "

# OS symbol with modern icons
[os]
disabled = false
format = "[ $symbol ]($style)"
style = "bg:surface0 fg:text"

[os.symbols]
Alpaquita = "󰣇 "
Alpine = "󰣇 "
Amazon = "󰸏 "
Android = "󰀲 "
Arch = "󰣇 "
Artix = "󰣇 "
CentOS = "󰣇 "
Debian = "󰣚 "
DragonFly = "󰣇 "
Emscripten = "󰛮 "
EndeavourOS = "󰣇 "
Fedora = "󰣛 "
FreeBSD = "󰣠 "
Garuda = "󰣇 "
Gentoo = "󰣨 "
HardenedBSD = "󰣠 "
Illumos = "󰣇 "
Linux = "󰌽 "
Mabox = "󰣇 "
Macos = "󰀵 "
Manjaro = "󰣇 "
Mariner = "󰣇 "
MidnightBSD = "󰣇 "
Mint = "󰣭 "
NetBSD = "󰣇 "
NixOS = "󱄅 "
OpenBSD = "󰣇 "
openSUSE = "󰣢 "
OracleLinux = "󰣇 "
Pop = "󰣇 "
Raspbian = "󰐿 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
Redox = "󰣇 "
Solus = "󰣇 "
SUSE = "󰣢 "
Ubuntu = "󰕈 "
Unknown = "󰌽 "
Windows = "󰖳 "

# User info with modern styling
[username]
disabled = false
style_user = "bg:surface0 fg:teal bold"
style_root = "bg:surface0 fg:red bold"
format = "[ $user ]($style)"
show_always = false

[hostname]
ssh_only = true
format = "[ @$hostname ]($style)"
style = "bg:surface0 fg:yellow bold"
trim_at = "."
disabled = false

# Directory with truncation and modern styling
[directory]
truncation_length = 3
truncate_to_repo = true
fish_style_pwd_dir_length = 1
use_logical_path = true
format = "[ $path ]($style)[$read_only]($read_only_style)"
repo_root_format = "[ $before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path ]($style)[$read_only]($read_only_style)"
style = "bg:blue fg:mantle bold"
read_only = " 󰌾 "
read_only_style = "bg:blue fg:red"
truncation_symbol = "…/"
repo_root_style = "bg:blue fg:crust bold"
before_repo_root_style = "bg:blue fg:surface2"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = "󰉍 "
"Music" = "󰝚 "
"Pictures" = "󰉏 "
"Videos" = "󰕧 "
"Desktop" = "󰚝 "
"Public" = "󰪮 "
"Templates" = "󱋣 "

# Git configuration with modern symbols
[git_branch]
symbol = "󰊢 "
format = "[ $symbol$branch(:$remote_branch) ]($style)"
style = "bg:mauve fg:mantle bold"
truncation_length = 30
only_attached = false

[git_status]
format = '([ $all_status$ahead_behind ]($style))'
style = "bg:mauve fg:mantle bold"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "=${count}"
deleted = "✘${count}"
renamed = "»${count}"
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"
stashed = "$${count}"

[git_metrics]
disabled = true

# Language versions with modern icons
[python]
symbol = "󰌠 "
format = '[ $symbol$pyenv_prefix($version )(\($virtualenv\) )]($style)'
style = "bg:surface1 fg:yellow bold"
pyenv_version_name = true
pyenv_prefix = "pyenv "
python_binary = ["./venv/bin/python", "python", "python3", "python2"]
detect_extensions = ["py"]
version_format = "v${raw}"

[nodejs]
symbol = "󰎙 "
format = "[ $symbol$version ]($style)"
style = "bg:surface1 fg:green bold"
detect_files = ["package.json", ".nvmrc"]
detect_folders = ["node_modules"]
detect_extensions = ["js", "mjs", "cjs", "ts", "tsx"]
version_format = "v${raw}"

[rust]
symbol = "󱘗 "
format = "[ $symbol$version ]($style)"
style = "bg:surface1 fg:red bold"
detect_extensions = ["rs"]
detect_files = ["Cargo.toml"]
version_format = "v${raw}"

[golang]
symbol = "󰟓 "
format = "[ $symbol$version ]($style)"
style = "bg:surface1 fg:sapphire bold"
detect_extensions = ["go"]
detect_files = ["go.mod", "go.sum", "glide.yaml", "Gopkg.yml", "Gopkg.lock", ".go-version"]
detect_folders = ["Godeps"]
version_format = "v${raw}"

[java]
symbol = "󰬷 "
format = "[ $symbol$version ]($style)"
style = "bg:surface1 fg:maroon bold"
detect_extensions = ["java", "class", "jar", "gradle", "clj", "cljc"]
detect_files = ["pom.xml", "build.gradle.kts", "build.sbt", ".java-version", "deps.edn", "project.clj", "build.boot"]
version_format = "v${raw}"

[lua]
symbol = "󰢱 "
format = "[ $symbol$version ]($style)"
style = "bg:surface1 fg:blue bold"
detect_extensions = ["lua"]
detect_files = [".lua-version"]
detect_folders = ["lua"]
version_format = "v${raw}"

[c]
symbol = "󰙱 "
format = "[ $symbol$version(-$name) ]($style)"
style = "bg:surface1 fg:teal bold"
detect_extensions = ["c", "h"]
detect_files = []
detect_folders = []
version_format = "v${raw}"

[cmake]
symbol = "󰔷 "
format = "[ $symbol$version ]($style)"
style = "bg:surface1 fg:blue bold"
detect_extensions = []
detect_files = ["CMakeLists.txt", "CMakeCache.txt"]
detect_folders = []
version_format = "v${raw}"

# Cloud and container platforms
[docker_context]
symbol = "󰡨 "
format = "[ $symbol$context ]($style)"
style = "bg:surface0 fg:blue bold"
only_with_files = true
detect_extensions = []
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]
detect_folders = []

[kubernetes]
symbol = "󱃾 "
format = '[ $symbol$context( \($namespace\)) ]($style)'
style = "bg:surface0 fg:sapphire bold"
disabled = false

[aws]
symbol = "󰸏 "
format = '[ $symbol$profile( \($region\))( \[$duration\]) ]($style)'
style = "bg:peach fg:mantle bold"
expiration_symbol = "X"
disabled = false

[gcloud]
symbol = "󱇶 "
format = '[ $symbol$account(@$domain)(\($region\)) ]($style)'
style = "bg:peach fg:mantle bold"
disabled = false

[azure]
symbol = "󰠅 "
format = "[ $symbol$subscription ]($style)"
style = "bg:peach fg:mantle bold"
disabled = false

# Package version
[package]
symbol = "󰏗 "
format = "[ $symbol$version ]($style)"
style = "bg:surface1 fg:peach bold"
display_private = false
disabled = false

# Command duration with better formatting
[cmd_duration]
min_time = 2_000
format = "[ 󰔛 $duration ]($style)"
style = "bg:yellow fg:mantle bold"
show_milliseconds = true
show_notifications = false
min_time_to_notify = 45_000

# Character with modern arrows
[character]
format = "$symbol "
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold mauve)"
vimcmd_replace_symbol = "[❮](bold mauve)"
vimcmd_visual_symbol = "[❮](bold yellow)"

# Line break for better readability
[line_break]
disabled = false
